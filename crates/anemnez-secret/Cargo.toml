[package]
name = "anemnez-secret"
description = "How a product on the Anemnez Stack holds its own key material: a value that never prints, keychain custody by code signature, and the owner check"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Time is handed in, never reached for (house rule 3): the verdict cache and retrust's bounds read the host's Clock.
# Dual form, as every release-chain crate takes it (E m/25990): a git build resolves it by git while Artichoke may be
# down, and a publish names the registry. At the family's settled clock, 66a972f441f2 (M m/25606, m/26302), which the
# SDK takes and fabric, artichoke and herald each take at their own family move.
anemnez-clock = { git = "ssh://git@github.com/anemnez/anemnez-clock.git", rev = "92307ea4fe1e", version = "0.1", registry-index = "sparse+http://127.0.0.1:7787/crates/index/" }
# The house's team id, its one home (rule 2; D m/32487): a crate with no dependencies, MIT OR Apache-2.0, re-exported as
# identity::ANEMNEZ_TEAM so callers' path stays. Dual form, as anemnez-clock.
anemnez-trust = { git = "ssh://git@github.com/anemnez/anemnez-extension.git", rev = "6c869f33ee04", version = "0.10", registry-index = "sparse+http://127.0.0.1:7787/crates/index/" }
# retrust: a private directory for the socket a successor connects to.
tempfile = "3"
sha2 = "0.10"
# identity: getsockopt(LOCAL_PEERTOKEN).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# signer: a host's own Ed25519 key, made from the OS's entropy.
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# signer: the key's plain copies (hex, the decoded bytes) are wiped on drop, as Secret and dalek's key are.
zeroize = "1"
# signer: a host that reads keys by their note alone, its macOS not exporting the access-list read, is said once at WARN
# (D m/37770).
tracing = "0.1"
# Custody calls the Security framework directly, so a value never passes through a command line.
security-framework = "3"
# identity: the running code behind a socket's audit token, and its signing information.
security-framework-sys = "2.17"
core-foundation = "0.10"
# The owner check: LAContext deviceOwnerAuthentication (Touch ID or the login password).
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"

[dev-dependencies]
# The verdict row drives a ManualClock, whose advance is async.
tokio = { version = "1", features = ["rt", "time"] }
tempfile = "3"
