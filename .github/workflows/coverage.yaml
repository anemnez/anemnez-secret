name: Coverage

# The judicious cadence: the instrumented conduct is the suite's most expensive leg, and the
# ratchet floor does not need per-commit sampling — one nightly conduct holds it, and a red morning
# bisects one day's commits. Manual dispatch covers "I want the number now".
#
# Red until the baseline exists: run `prova run coverage --update-baseline` once and commit
# .prova/baselines/quality.json.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  coverage:
    name: Line coverage (ratcheted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The suite pins `project-standards` to `ssh://git@github.com/anemnez/…`. A developer's key
      # already opens that; a runner's does not. This rewrites it onto a token at the git layer, so
      # the SAME pin resolves in both places; without it the run dies at dependency resolution.
      # ANEMNEZ_CI_TOKEN is an organization secret, so it is already available to this repository.
      - uses: anemnez/prova-project-standards/.github/actions/anemnez-git-auth@v1
        with:
          token: ${{ secrets.ANEMNEZ_CI_TOKEN }}
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest and cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Coverage (prova run coverage)
        uses: prova-rs/run-action@v1
        with:
          profile: coverage

