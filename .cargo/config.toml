# Artichoke, the Anemnez registry (artichoke docs/specs/REGISTRY.md §11), as every release-chain crate carries it
# (anemnez-layout, anemnez-vcs): a git build of anemnez-secret resolves anemnez-clock by git and needs none of this;
# packaging and publishing resolve its registry-index, which reads the read token from ~/.cargo/credentials.toml or the
# macOS keychain, per host.
[registries.artichoke]
index = "sparse+http://127.0.0.1:7787/crates/index/"

[registry]
global-credential-providers = ["cargo:token", "cargo:macos-keychain"]
